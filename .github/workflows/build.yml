name: SonarQube & Release

on:
  push:
    branches:
      - main
  pull_request:
    # Trigger für PRs auf jeden Branch
    types: [opened, synchronize, reopened]

permissions:
  contents: write
  pull-requests: read

jobs:
  build:
    name: Build, Test and Analyze
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: 'zulu'

      - name: Cache SonarQube packages
        uses: actions/cache@v4
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      # Kompiliert sowohl die Debug- als auch die Release-Variante
      - name: Compile Application (Debug & Release)
        run: ./gradlew assembleDebug assembleRelease

      - name: Run Unit Tests & Coverage
        run: ./gradlew ciTest jacocoTestReport

      - name: Run SonarQube Analysis
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: ./gradlew sonar --info

      - name: Create GitHub Release and Upload APKs
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: "release-${{ github.run_number }}"
          name: "Release #${{ github.run_number }}"
          body: |
            Automatisches Build-Release nach Merge auf den main-Branch.
            - **Debug-APK**: Für Testing und Logging.
            - **Release-APK**: Optimierte und signierte Version.
          files: |
            app/build/outputs/apk/debug/app-debug.apk
            ${{ steps.sign_app.outputs.signedReleaseFile }}
